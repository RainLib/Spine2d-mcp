[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spine-pipeline-mcp"
version = "0.2.0"
description = "Local, staging-first Spine pipeline MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RainLib"}]
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.urls]
Homepage = "https://github.com/RainLib/Spine2d-mcp"
Issues = "https://github.com/RainLib/Spine2d-mcp/issues"

[project.scripts]
spine-pipeline-mcp = "spine_pipeline_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
