# Merge this named table into the intended Codex config; do not replace the whole file.
# Replace /path placeholders before use. No API key is required by this local MCP.
[mcp_servers.spine-pipeline]
command = "uv"
args = ["--directory", "/path/to/Spine2d-mcp", "run", "--locked", "spine-pipeline-mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 300

[mcp_servers.spine-pipeline.env]
SPINE_MCP_SOURCE_ROOT = "/path/to/test-assets"
SPINE_MCP_STAGING_ROOT = "/path/to/separate-staging"
# Optional native operations; omit until installed/licensed and reviewed:
# SPINE_MCP_CLI = "/path/to/Spine"
# SPINE_MCP_CLI_VERSION = "4.3.26"
# SPINE_MCP_GODOT_EXECUTABLE = "/path/to/spine-enabled-godot"
